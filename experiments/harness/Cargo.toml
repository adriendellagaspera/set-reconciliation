[package]
name = "set-reconciliation-experiments"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental harnesses, comparative benchmarks, transport modeling, and policy probes for set reconciliation."

[dependencies]
rsos = { path = "../../rsos" }
rbsr = { path = "../../rbsr" }
set-reconciliation-comparators = { path = "../../comparators" }
lww-register = { version = "=0.6.0", features = ["serde"] }
bincode = "1.3.3"
rand = "0.8.5"
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.151"
devkit = { path = "../devkit" }

[dev-dependencies]
proptest = "=1.11.0"
criterion = "0.5.1"
reconcile = { git = "https://github.com/adriendellagaspera/reconcile-rs", rev = "e2e36834dddfed6f791fd4b9ba32be17701f7b2a" }
gossip = { package = "reconcile-gossip", git = "https://github.com/adriendellagaspera/reconcile-rs", rev = "e2e36834dddfed6f791fd4b9ba32be17701f7b2a", features = ["netem"] }
async-trait = "0.1"
parking_lot = "0.12.1"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rbsr_internal_testing)"] }

[lib]
name = "set_reconciliation_experiments"
path = "src/lib.rs"

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "reconciliation"
harness = false
