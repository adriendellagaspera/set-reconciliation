name: stable

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'rsos/**'
      - 'rbsr/**'
      - 'scripts/check-benchmark-boundaries.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'rsos/**'
      - 'rbsr/**'
      - 'scripts/check-benchmark-boundaries.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: bash scripts/check-benchmark-boundaries.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo bench --workspace --no-run
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo package --workspace

  internal-seams:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings --cfg rbsr_internal_testing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Old downstream cfg must be gone
        run: '! grep -R "reconcile_internal_testing" rsos rbsr'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      - run: cargo semver-checks --workspace
