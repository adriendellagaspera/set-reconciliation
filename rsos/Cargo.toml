[package]
name = "rsos"
version = "0.5.3"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A Range-Summarizable Order-Statistics Store (RSOS): the Rsos<K> trait and its FingerprintTreeMap<K, V> realization."
repository = "https://github.com/adriendellagaspera/set-reconciliation"
readme = "README.md"
keywords = ["rsos", "fingerprint", "btree", "range", "blake3"]
categories = ["data-structures"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rbsr_internal_testing)"] }

[dependencies]
arrayvec = "0.7.4"
blake3 = "1.5"
range-cmp = "1"
serde = { version = "1.0.192", features = ["derive"] }
tracing = "0.1.40"

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "micro"
harness = false

[dev-dependencies]
criterion = "0.5.1"
proptest = "=1.11.0"
once_cell = "1.21.3"
parking_lot = "0.12.1"
rand = "0.8.5"
